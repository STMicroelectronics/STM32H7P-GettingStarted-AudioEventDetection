{
  "version"     : "0.1",
  "description" : "STM32H7P5I-DK Getting Started Audio Event Detection (CMake/Ninja)",
  "series"      : "stm32h7",
  "board"       : "STM32H7P5I-DK",
  "builder"     : "makefile",
  "env"         :
  {
    "cproject_name"        : "STM32H7P-GettingStarted-AED",
    "BoardFolder"          : "${ProjectFolder}/STM32H7P5I-DK",
    "cwd"                  : "${BoardFolder}",
    "flasher"              : "${STM32CubeProgrammer}",
    "cmake"                : "cmake",
    "cmake_preset"         : "debug_GCC_STM32H7P5I-DK",
    "network_src_root"     : "${BoardFolder}/generated/ai",
    "app_src_dpu"          : "${ProjectFolder}/application/dpu",
    "stedgeai_lib_root"    : "${ProjectFolder}/middleware/stedgeai-lib",
  },
  "templates": [
    [ "", "${network_src_root}/network.c", "copy"],
    [ "", "${network_src_root}/network.h", "copy"],
    [ "", "${network_src_root}/stai_network.c", "copy"],
    [ "", "${network_src_root}/stai_network.h", "copy"],
    [ "", "${network_src_root}/network_ecblobs.h", "copy"],
    [ "", "${network_src_root}/network_sysmem.eFlash1.c", "copy"],
    [ "", "${network_src_root}/network_sysmem.eFlash2.c", "copy"],
    [ "", "${network_src_root}/network_generate_report.txt", "copy"],
    [ "", "${app_src_dpu}/ai_model_config.h", "copy"],
    [ "", "${app_src_dpu}/user_mel_tables.h", "copy"],
    [ "", "${app_src_dpu}/user_mel_tables.c", "copy"]
  ],
  "memory_pool":
  {
    "neuralart_user_path": "${ProjectFolder}/model/profiles.json",
    "profile": "default-h7"
  },
  "configurations" : [
    {
      "name" : "debug_GCC_STM32H7P5I-DK",
      "cwd" : "${BoardFolder}",
      "stedgeai_lib_location" : "${stedgeai_lib_root}",
      "runtime_lib_ref_files" : ["${network_src_root}/steai.middleware.cmake"],
      "build_cmd" : "${cmake} --preset ${cmake_preset} && ${cmake} --build --preset ${cmake_preset} --clean-first",
      "flash_cmd" : "${flasher} -c port=swd -w build/${cmake_preset}/${cproject_name}.elf -v -rst"
    },
  ]
}
